name: Full DNA Lab synthetic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  dna-source-and-local-mode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3
      - run: python tools/check_web_source.py --php php
