name: ZeroThink local checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  engine-and-cli:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - run: node cli.cjs --question "What evidence is required to compare energy efficiency?" --document examples/synthetic-evidence.md --process gap-analysis --json
